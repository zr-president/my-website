<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<script>!function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t)}()</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>页面不存在 | 钟锐个人数字空间</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1a2e;--text2:#555;--text3:#888;--accent:#4f46e5;--border:#e5e7eb;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
[data-theme="dark"]{--bg:#0d0f15;--card:#1a1d28;--text:#e8eaef;--text2:#a0a5b5;--text3:#656b7a;--accent:#818cf8;--border:#262a36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.7}
.box{text-align:center;max-width:480px;padding:40px 24px}
.code{font-size:72px;font-weight:800;background:linear-gradient(135deg,var(--accent),#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:20px;margin:12px 0 8px}
p{font-size:13px;color:var(--text2);margin-bottom:24px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:10px 22px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600}
a.home{background:var(--accent);color:#fff}
a.search{background:var(--card);border:1px solid var(--border);color:var(--text)}
a.btn:hover{opacity:.85;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这个页面跑到异世界去了…</h1>
  <p>你访问的页面不存在或已被更新移除。可能是旧链接，也可能是打字时手滑了。</p>
  <div class="btns">
    <a class="btn home" href="index.html">🏠 返回首页</a>
    <a class="btn search" href="search.html">📚 知识库搜索</a>
  </div>
</div>
</body>
</html>
