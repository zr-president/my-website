name: Life OS Push

on:
  schedule:
    # Beijing 08:03 (UTC 0:03) — Morning Briefing
    - cron: '3 0 * * *'
    # Beijing 12:03 (UTC 4:03) — Midday Check-in
    - cron: '3 4 * * *'
    # Beijing 18:03 (UTC 10:03) — Evening Entertainment
    - cron: '3 10 * * *'
    # Beijing 22:03 (UTC 14:03) — Night Review
    - cron: '3 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Push mode'
        required: true
        type: choice
        options:
          - morning
          - midday
          - evening
          - night
          - test

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine push mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Trigger: manual dispatch"
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date +%H)
            echo "Trigger: cron schedule (UTC hour=$HOUR)"
            case $HOUR in
              00|01) MODE="morning" ;;
              04|05) MODE="midday" ;;
              10|11) MODE="evening" ;;
              14|15) MODE="night" ;;
              *)     MODE="morning" ;;  # fallback
            esac
            echo "mode=$MODE" >> $GITHUB_OUTPUT
          fi

      - name: Show selected mode
        run: echo "Mode = ${{ steps.mode.outputs.mode }}"

      - name: Debug environment
        run: |
          echo "Python version: $(python --version)"
          echo "Node version: $(node --version)"
          echo "Working directory: $(pwd)"
          echo "Files: $(ls -la daily_data.js personal_config.js scripts/life_os_push.py 2>&1)"
          echo "Token set: ${{ secrets.PUSHPLUS_TOKEN != '' }}"

      - name: Run push script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python scripts/life_os_push.py --mode ${{ steps.mode.outputs.mode }}
