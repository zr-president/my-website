name: AI 每日自动更新

on:
  # 北京 6:00（UTC 22:00 前一日）每日自动更新内容
  # 选 6:00 的原因：①DeepSeek 峰谷定价——工作日白天为高峰（部分场景最高涨1100%），凌晨为低谷约半价
  # ②周末全天按低谷价计费（8/23 新规）③6:00 跑完，用户 8 点起床看到的就是最新内容
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      update_status: ${{ steps.run_update.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run AI auto update
        id: run_update
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret 未配置 —— 跳过自动更新（可在仓库 Settings → Secrets and variables → Actions 中添加）"
            exit 0
          fi
          python scripts/auto_update.py --commit

  # #105: 自动更新结果监控——失败时让 run 显式失败（Actions 徽章可见）+ 可选 PushPlus 告警
  notify-on-fail:
    needs: auto-update
    if: ${{ always() && needs.auto-update.outputs.update_status != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark run as failed so GitHub shows it in the Actions badge
        run: |
          echo "❌ AI 每日自动更新未能成功完成（状态: ${{ needs.auto-update.outputs.update_status }}）"
          echo "请在 Actions 页查看日志定位原因（常见：DEEPSEEK_API_KEY 失效 / 脚本报错 / 网络超时）"
          exit 1

      - name: Send PushPlus notification (only if token configured)
        if: ${{ secrets.PUSHPLUS_TOKEN != '' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"⚠️ 网站自动更新失败\",\"content\":\"AI 每日自动更新未能成功（${{ needs.auto-update.outputs.update_status }}）。请前往 GitHub Actions 查看日志。\"}"
          echo "已发送 PushPlus 失败告警"
