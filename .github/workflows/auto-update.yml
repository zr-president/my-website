name: AI 每日自动更新

on:
  # 北京 6:00（UTC 22:00 前一日）每日自动更新内容
  # 选 6:00 的原因：①DeepSeek 峰谷定价——工作日白天为高峰（部分场景最高涨1100%），凌晨为低谷约半价
  # ②周末全天按低谷价计费（8/23 新规）③6:00 跑完，用户 8 点起床看到的就是最新内容
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run AI auto update
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret 未配置 —— 跳过自动更新（可在仓库 Settings → Secrets and variables → Actions 中添加）"
            exit 0
          fi
          python scripts/auto_update.py --commit
