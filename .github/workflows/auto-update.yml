name: AI 每日自动更新

on:
  schedule:
    # 北京 8:30（UTC 0:30）每日自动更新内容
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run AI auto update
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret 未配置 —— 跳过自动更新（可在仓库 Settings → Secrets and variables → Actions 中添加）"
            exit 0
          fi
          python scripts/auto_update.py --commit
