<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Diagnostic</title></head>
<body>
<h1>Site Diagnostic</h1>
<div id="results"></div>
<script>
var results = document.getElementById('results');
function log(msg, ok) {
  results.innerHTML += '<p style="color:'+(ok?'green':'red')+'">'+(ok?'✓':'✗')+' '+msg+'</p>';
}

// Test 1: Can we execute JS?
log('JavaScript is executing', true);

// Test 2: Try to load detail_content.js
var s1 = document.createElement('script');
s1.src = 'detail_content.js';
s1.onload = function() {
  log('detail_content.js loaded, DETAIL keys: '+Object.keys(DETAIL).length, Object.keys(DETAIL).length > 0);

  // Test openDetail
  if (typeof openDetail === 'function') {
    log('openDetail function exists', true);
  } else {
    log('openDetail function MISSING (inline script issue)', false);
  }

  // Test 3: Load daily_data.js
  var s2 = document.createElement('script');
  s2.src = 'daily_data.js';
  s2.onload = function() {
    log('daily_data.js loaded', true);
    log('DAILY_DATA: '+(typeof DAILY_DATA), typeof DAILY_DATA !== 'undefined');
    log('PICKS: '+(typeof PICKS), typeof PICKS !== 'undefined');
    log('INSIGHTS: '+(typeof INSIGHTS), typeof INSIGHTS !== 'undefined');
    log('DAILY_BRIEFING: '+(typeof DAILY_BRIEFING), typeof DAILY_BRIEFING !== 'undefined');
  };
  s2.onerror = function() { log('daily_data.js FAILED to load', false); };
  document.head.appendChild(s2);
};
s1.onerror = function() { log('detail_content.js FAILED to load', false); };
document.head.appendChild(s1);
</script>
</body></html>
